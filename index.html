<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione Magazzino</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#f3f5f7;color:#1b1b1b}
h1{margin:0 0 22px;font-size:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 3px #00000012}
h3{margin:0 0 14px}
input[type=file]{max-width:100%}
#stato{margin-top:16px}
.search{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.table-wrap{margin-top:16px;overflow:auto;max-height:65vh}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{position:sticky;top:0;background:#f0f2f4;z-index:1}
th,td{padding:9px 8px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}
td.num,th.num{text-align:right}
.qty{width:80px;padding:7px;border:1px solid #bbb;border-radius:6px;text-align:right}
.ok{color:#187a32;font-weight:bold}
.bad{color:#c62828;font-weight:bold}
.warn{color:#b26a00;font-weight:bold}
.small{font-size:13px;color:#666;margin-top:8px}
@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<h1>Gestione Magazzino</h1>

<div class="grid">
  <div class="card">
    <h3>1. File Magazzino</h3>
    <input id="magFile" type="file" accept=".xls,.xlsx,.xlsm">
    <div id="magStatus" class="small">Nessun file caricato</div>
  </div>
  <div class="card">
    <h3>2. Anagrafica SIZE</h3>
    <input id="sizeFile" type="file" accept=".xls,.xlsx,.xlsm">
    <div id="sizeStatus" class="small">Nessun file caricato</div>
  </div>
</div>

<div id="stato" class="card">Carica i due file per visualizzare il magazzino.</div>

<div class="card" style="margin-top:16px">
  <input id="search" class="search" placeholder="Cerca prodotto...">
</div>

<div class="card table-wrap">
<table>
<thead>
<tr>
<th>Prodotto</th>
<th class="num">Iniziale</th>
<th class="num">Danni</th>
<th class="num">Venduto</th>
<th class="num">BOX</th>
<th class="num">SLEEVE</th>
<th class="num">Sing.</th>
<th class="num">Atteso</th>
<th class="num">Effettivo</th>
<th class="num">Diff.</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Magazzino</title><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>body{font-family:Arial;margin:24px;background:#f4f6f8}button{padding:12px 18px;border:none;border-radius:8px;background:#0a6;color:#fff;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;padding:18px;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #ddd}input.qty{width:72px;padding:6px}</style></head><body><h1>Gestione Magazzino v2</h1><div class="grid"><div class="card"><h3>1. File Magazzino</h3><input id="mag" type="file" accept=".xls,.xlsx,.xlsm"></div><div class="card"><h3>2. Anagrafica SIZE</h3><input id="size" type="file" accept=".xls,.xlsx,.xlsm"></div></div><div id="stato" class="card" style="margin-top:16px">Carica entrambi i file.</div><div class="card" style="margin-top:16px"><input id="search" placeholder="Cerca prodotto..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"></div><div class="card" style="margin-top:16px;overflow:auto"><table><thead><tr><th>Prodotto</th><th>Iniziale</th><th>BOX</th><th>SLEEVE</th><th>Sing.</th><th>Atteso</th><th>Effettivo</th><th>Diff.</th></tr></thead><tbody id="body"></tbody></table></div><script src="app.js"></script></body></html>
